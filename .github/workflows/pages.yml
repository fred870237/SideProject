# 把三個 App 組成一個網站部署到 GitHub Pages
# 網址：/animal-map/、/nihongo/、/storybook/，首頁是 .github/pages-index.html
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir _site
          cp -r animal-map/animal-map _site/animal-map
          cp -r nihongo/public _site/nihongo
          cp -r storybook/public _site/storybook
          cp .github/pages-index.html _site/index.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
