<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff4e0">
  <title>經典故事書</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="故事書">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 書架 -->
  <main id="shelf" class="view">
    <header class="shelf-head">
      <h1>📚 經典故事書</h1>
      <p>點一本書，開始讀故事吧！</p>
      <button id="btn-night" class="night-btn" aria-pressed="false">🌙 睡前模式</button>
      <div id="night-panel" class="night-panel" hidden>
        <p>畫面變暗、唸得比較慢、不出小問答。<br>讀完幾本就說晚安？</p>
        <div class="night-options">
          <button data-limit="1">1 本</button>
          <button data-limit="2">2 本</button>
          <button data-limit="3">3 本</button>
          <button data-limit="0" class="off">關閉</button>
        </div>
      </div>
    </header>
    <div id="install-tip" class="install-tip" hidden></div>
    <nav id="region-tabs" class="region-tabs" aria-label="地區"></nav>
    <div id="book-sections"></div>
  </main>

  <!-- 閱讀器 -->
  <section id="reader" class="view" hidden>
    <header class="reader-bar">
      <button id="btn-home" class="icon-btn" aria-label="回書架">🏠</button>
      <h2 id="book-title"></h2>
      <button id="btn-auto" class="icon-btn" aria-label="自動播放" aria-pressed="false">▶</button>
      <button id="btn-zhuyin" class="icon-btn zy-btn" aria-label="注音" aria-pressed="false">ㄅ</button>
      <button id="btn-speak" class="icon-btn" aria-label="朗讀" aria-pressed="false">🔈</button>
    </header>

    <div id="book" class="book" aria-live="polite"></div>

    <footer class="reader-nav">
      <button id="btn-prev" class="nav-btn" aria-label="上一頁">◀</button>
      <div id="dots" class="dots"></div>
      <button id="btn-next" class="nav-btn" aria-label="下一頁">▶</button>
    </footer>
  </section>

  <!-- 睡前模式讀完設定的本數後蓋上 -->
  <div id="goodnight" class="goodnight" hidden>
    <div class="gn-moon">🌙</div>
    <h2>晚安，做個好夢</h2>
    <p>今天的故事讀完囉，閉上眼睛睡覺吧。</p>
    <button id="btn-unlock" class="unlock"><span>🔓 爸媽長按 3 秒解除</span></button>
  </div>

  <script src="app.js"></script>
</body>
</html>
